services:
  - type: web
    name: emplacamentos-bot-poc
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: LLM_PROVIDER
        value: "claude"
      - key: LLM_MODEL
        value: "claude-haiku-5-5"
      - key: SYNTHETIC_DB_SCALE
        value: "1.0"
      - key: MIN_K_ANONYMITY
        value: "5"
      - key: ANTHROPIC_API_KEY
        sync: false
