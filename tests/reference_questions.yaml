# Conjunto de Perguntas de Referencia (Secao 9 do AGENTS.md)
# Cobre obrigatoriamente:
# - volume por periodo (Q001)
# - volume por regiao (Q002)
# - volume por segmento (Q003)
# - volume por marca (Q004)
# - ranking de modelos (Q005)
# - participacao de mercado por marca + filtro de segmento (Q006, Q011)
# - comparacao/variacao entre periodos (Q007)
# - pergunta ambigua (Q008, Q012)
# - pergunta fora do escopo (Q009)
# - pergunta que exige contagem minima / supressao por privacidade k < 5 (Q010)

- id: Q001
  pergunta: "Quantos caminhões foram emplacados no último mês?"
  nivel: facil
  central: true
  resposta_esperada: "19.418"
  sql_gabarito: >
    SELECT COUNT(e.id_emplacamento) AS valor
    FROM emplacamento e
    WHERE strftime('%Y-%m', e.data_emplacamento) = '2026-10'
  comportamento_esperado: responder

- id: Q002
  pergunta: "Qual o volume de emplacamentos por região em 2025?"
  nivel: facil
  central: true
  resposta_esperada: "Sudeste"
  sql_gabarito: >
    SELECT
      CASE
        WHEN UPPER(TRIM(cid_emp.UF)) IN ('PR', 'SC', 'RS') THEN 'Sul'
        WHEN UPPER(TRIM(cid_emp.UF)) IN ('SP', 'RJ', 'MG', 'ES') THEN 'Sudeste'
        WHEN UPPER(TRIM(cid_emp.UF)) IN ('MT', 'MS', 'GO', 'DF') THEN 'Centro-Oeste'
        WHEN UPPER(TRIM(cid_emp.UF)) IN ('BA', 'PE', 'CE', 'MA', 'PI', 'RN', 'PB', 'AL', 'SE') THEN 'Nordeste'
        WHEN UPPER(TRIM(cid_emp.UF)) IN ('PA', 'AM', 'TO', 'RO', 'AC', 'RR', 'AP') THEN 'Norte'
        ELSE 'Não informado'
      END AS regiao_emplacamento,
      COUNT(e.id_emplacamento) AS valor
    FROM emplacamento e
    LEFT JOIN cidade cid_emp ON e.id_cidade = cid_emp.id_cidade
    WHERE strftime('%Y', e.data_emplacamento) = '2025'
    GROUP BY regiao_emplacamento
    ORDER BY valor DESC
  comportamento_esperado: responder

- id: Q003
  pergunta: "Qual a participação por segmento em 2025?"
  nivel: facil
  central: true
  resposta_esperada: "PESADO"
  sql_gabarito: >
    WITH base_agg AS (
      SELECT UPPER(TRIM(m.segmento)) AS segmento,
             COUNT(e.id_emplacamento) AS volume
      FROM emplacamento e
      INNER JOIN chassi ch ON e.id_chassi = ch.id_chassi
      INNER JOIN modelo m ON ch.id_modelo = m.id_modelo
      WHERE strftime('%Y', e.data_emplacamento) = '2025'
      GROUP BY segmento
    )
    SELECT segmento,
           volume,
           SUM(volume) OVER () AS volume_total_mercado,
           ROUND(volume * 100.0 / NULLIF(SUM(volume) OVER (), 0), 2) AS valor
    FROM base_agg
    ORDER BY valor DESC
  comportamento_esperado: responder

- id: Q004
  pergunta: "Quantos caminhões da SCANIA foram emplacados em 2025?"
  nivel: facil
  central: true
  resposta_esperada: "emplacamentos de caminhões novos"
  sql_gabarito: >
    SELECT COUNT(e.id_emplacamento) AS valor
    FROM emplacamento e
    INNER JOIN chassi ch ON e.id_chassi = ch.id_chassi
    INNER JOIN modelo m ON ch.id_modelo = m.id_modelo
    WHERE strftime('%Y', e.data_emplacamento) = '2025'
      AND UPPER(TRIM(m.fabricante)) = 'SCANIA'
