- id: Q005
  pergunta: "Qual o top 5 ranking de modelos mais emplacados em 2025?"
  nivel: media
  central: true
  resposta_esperada: "1º"
  sql_gabarito: >
    SELECT UPPER(TRIM(m.modelo)) AS modelo,
           UPPER(TRIM(m.fabricante)) AS marca,
           COUNT(e.id_emplacamento) AS valor
    FROM emplacamento e
    INNER JOIN chassi ch ON e.id_chassi = ch.id_chassi
    INNER JOIN modelo m ON ch.id_modelo = m.id_modelo
    WHERE strftime('%Y', e.data_emplacamento) = '2025'
    GROUP BY modelo, marca
    ORDER BY valor DESC
    LIMIT 5
  comportamento_esperado: responder

- id: Q006
  pergunta: "Qual a participação de mercado da DAF em 2026 apenas no segmento pesado?"
  nivel: media
  central: true
  resposta_esperada: "11,62%"
  sql_gabarito: >
    WITH base_agg AS (
      SELECT UPPER(TRIM(m.fabricante)) AS marca,
             COUNT(e.id_emplacamento) AS volume
      FROM emplacamento e
      INNER JOIN chassi ch ON e.id_chassi = ch.id_chassi
      INNER JOIN modelo m ON ch.id_modelo = m.id_modelo
      WHERE strftime('%Y', e.data_emplacamento) = '2026'
        AND UPPER(TRIM(m.segmento)) = 'PESADO'
      GROUP BY marca
    ),
    shares AS (
      SELECT marca,
             volume,
             SUM(volume) OVER () AS volume_total_mercado,
             ROUND(volume * 100.0 / NULLIF(SUM(volume) OVER (), 0), 2) AS valor
      FROM base_agg
    )
    SELECT marca, volume, volume_total_mercado, valor
    FROM shares
    WHERE marca = 'DAF'
    ORDER BY valor DESC
  comportamento_esperado: responder

- id: Q007
  pergunta: "Qual foi a variação de emplacamentos de 2025 contra 2024?"
  nivel: media
  central: true
  resposta_esperada: "variação"
  sql_gabarito: >
    WITH period_totals AS (
      SELECT
        SUM(CASE WHEN strftime('%Y', e.data_emplacamento) = '2025' THEN 1 ELSE 0 END) AS volume_atual,
        SUM(CASE WHEN strftime('%Y', e.data_emplacamento) = '2024' THEN 1 ELSE 0 END) AS volume_anterior
      FROM emplacamento e
      WHERE strftime('%Y', e.data_emplacamento) IN ('2025', '2024')
    )
    SELECT
      volume_atual,
      volume_anterior,
      (volume_atual - volume_anterior) AS variacao_absoluta,
      ROUND(((volume_atual - volume_anterior) * 100.0) / NULLIF(volume_anterior, 0), 2) AS valor
    FROM period_totals
  comportamento_esperado: responder

